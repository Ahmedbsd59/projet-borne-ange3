<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BorneInteract — Accès Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0f0f1a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-box{background:#16162a;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:40px;width:380px;box-shadow:0 24px 80px rgba(0,0,0,0.6);}
.l-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.l-ico{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:16px;}
.l-brand{font-size:16px;font-weight:700;}
.l-brand span{color:#7c3aed;}
h2{font-size:20px;font-weight:700;margin-bottom:6px;}
p{font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:24px;}
label{display:block;font-size:11px;color:rgba(255,255,255,0.6);margin-bottom:6px;font-weight:500;}
input{width:100%;padding:11px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;font-size:13px;font-family:'Inter',sans-serif;outline:none;margin-bottom:14px;transition:border-color .2s;}
input:focus{border-color:#7c3aed;}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .2s;}
.btn:hover{opacity:.9;}
.hint{text-align:center;margin-top:16px;font-size:11px;color:rgba(255,255,255,0.3);}
.err{color:#ef4444;font-size:11px;margin-bottom:10px;display:none;}
.pw-wrap{position:relative;}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.4);font-size:1rem;padding:0;line-height:1;}
</style>
</head>
<body>
<div class="login-box">
  <div class="l-logo">
    <div class="l-ico">🎮</div>
    <div class="l-brand">Borne<span>Interact</span></div>
  </div>
  <h2>Accès Administrateur</h2>
  <p>Connectez-vous pour accéder au tableau de bord.</p>
  <div class="err" id="err">❌ Identifiants incorrects</div>
  <label>Identifiant</label>
  <input type="text" id="login" placeholder="admin" autocomplete="username">
  <label>Mot de passe</label>
  <div class="pw-wrap">
    <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')tryLogin()" style="padding-right:40px;">
    <button type="button" class="pw-eye" onclick="const i=document.getElementById('pwd');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈';">👁</button>
  </div>
  <button class="btn" onclick="tryLogin()">Se connecter →</button>
</div>
<script>
if(sessionStorage.getItem('admin_logged')) window.location.href='dashboard.html';

async function tryLogin(){
  const l=document.getElementById('login').value.trim();
  const p=document.getElementById('pwd').value;
  const errEl=document.getElementById('err');
  errEl.style.display='none';

  if(!l||!p){ errEl.textContent='❌ Veuillez remplir tous les champs.'; errEl.style.display='block'; return; }

  try {
    const res = await fetch('../api/admin_login.php', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ login:l, password:p })
    });
    const data = await res.json();
    if(data.success){
      // Stocker dans localStorage — mêmes clés que dashboard.html
      localStorage.setItem('admin_token',  data.token       || '');
      localStorage.setItem('csrf_token',   data.csrf_token  || '');
      localStorage.setItem('admin_role',   data.role        || 'maintenance');
      localStorage.setItem('admin_login',  data.login       || l);
      // sessionStorage pour compatibilité ancienne
      sessionStorage.setItem('admin_logged','1');
      window.location.href='dashboard.html';
    } else {
      errEl.textContent='❌ ' + (data.message || 'Identifiants incorrects');
      errEl.style.display='block';
    }
  } catch {
    errEl.textContent='❌ Impossible de contacter le serveur.';
    errEl.style.display='block';
  }
}
</script>
</body>
</html>
