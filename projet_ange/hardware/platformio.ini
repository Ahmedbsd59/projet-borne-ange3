; ============================================================
; PlatformIO — Lecteur RFID BornePlay
; Carte : ESP8266 NodeMCU 1.0 (ESP-12E)
; ============================================================

[env:nodemcuv2]
platform      = espressif8266
board         = nodemcuv2
framework     = arduino

; Vitesse upload (réduis à 115200 si erreurs)
upload_speed  = 460800
monitor_speed = 115200

; Librairies
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11

; Options de build
build_flags =
    -D MONITOR_SPEED=115200

; Port série (détection automatique, sinon décommente et adapte)
; upload_port = /dev/cu.usbserial-0001
; monitor_port = /dev/cu.usbserial-000
