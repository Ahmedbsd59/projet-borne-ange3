<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Memory Magasin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: radial-gradient(ellipse at top,#0a2010 0%,#0d0d14 60%);
  font-family:'Poppins',sans-serif; min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:20px; color:white;
}
header { text-align:center; margin-bottom:16px; }
.btn-back {
  position:fixed; top:14px; left:18px; z-index:50;
  padding:8px 18px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:30px;
  color:rgba(255,255,255,.7);
  font-family:inherit; font-size:.85rem; font-weight:500;
  cursor:pointer; text-decoration:none;
  transition:all .2s;
}
.btn-back:hover { background:rgba(255,255,255,.15); color:#fff; }
header h1 { font-size:2rem; font-weight:800; background:linear-gradient(135deg,#10B981,#34D399); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
header p  { color:rgba(255,255,255,.45); font-size:.9rem; margin-top:4px; }

/* HUD */
.hud {
  display:flex; gap:20px; margin-bottom:16px;
  background:rgba(255,255,255,.05); padding:10px 28px; border-radius:50px;
  border:1px solid rgba(16,185,129,.25);
}
.hud-item { text-align:center; }
.hud-value { font-size:1.5rem; font-weight:700; color:#10B981; }
.hud-label { font-size:.7rem; color:rgba(255,255,255,.4); }
#timer-val.urgent { color:#EF4444 !important; animation:blink .5s infinite; }
@keyframes blink { 50%{opacity:.3} }

/* Difficulté */
.diff-btns { display:flex; gap:8px; margin-bottom:16px; }
.diff-btn {
  padding:6px 18px; border-radius:20px; border:1px solid rgba(16,185,129,.3);
  background:rgba(16,185,129,.08); color:rgba(255,255,255,.6);
  cursor:pointer; font-family:inherit; font-size:.85rem; transition:all .2s;
}
.diff-btn.active { background:rgba(16,185,129,.25); border-color:#10B981; color:#fff; font-weight:600; }

/* GRID */
#grid { display:grid; gap:10px; margin-bottom:16px; }
.card { perspective:600px; cursor:pointer; }
.card-inner {
  width:100%; height:100%;
  transition:transform .45s cubic-bezier(.4,0,.2,1);
  transform-style:preserve-3d; position:relative;
}
.card.flipped .card-inner,
.card.matched .card-inner { transform:rotateY(180deg); }
.card.matched .card-front {
  background:linear-gradient(135deg,#065f46,#10B981) !important;
  border-color:#10B981;
  box-shadow:0 0 16px rgba(16,185,129,.5);
}
.card.shaking { animation:shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

.card-front, .card-back {
  position:absolute; width:100%; height:100%;
  backface-visibility:hidden; border-radius:14px;
  display:flex; align-items:center; justify-content:center; border:2px solid;
}
.card-back {
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  border-color:rgba(16,185,129,.4);
}
.card-back::after { content:'?'; color:rgba(16,185,129,.6); font-weight:800; font-size:1.8rem; font-family:'Poppins',sans-serif; }
.card-front {
  background:linear-gradient(135deg,#0a1628,#0f2744);
  border-color:rgba(255,215,0,.5); transform:rotateY(180deg);
}

/* MODAL */
#win-modal {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.88); z-index:100;
  align-items:center; justify-content:center;
  backdrop-filter:blur(4px);
}
#win-modal.show { display:flex; animation:fadeIn .3s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal-box {
  background:linear-gradient(135deg,#071810,#0a2010);
  border-radius:24px; padding:40px 44px; text-align:center;
  max-width:420px; width:90%;
  animation:zoomIn .4s cubic-bezier(.175,.885,.32,1.275);
}
.modal-box.win  { border:2px solid #10B981; box-shadow:0 0 60px rgba(16,185,129,.3); }
.modal-box.lose { border:2px solid #4b5563; }
@keyframes zoomIn { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }
.modal-icon  { font-size:4.5rem; margin-bottom:12px; display:block; }
.modal-title { font-size:1.8rem; font-weight:800; margin-bottom:10px; }
.win .modal-title { color:#10B981; }
.lose .modal-title { color:#9ca3af; }
.modal-text  { font-size:1rem; color:rgba(255,255,255,.75); margin-bottom:18px; }
.score-badge {
  background:rgba(255,215,0,.1); border:1px solid rgba(255,215,0,.35);
  border-radius:12px; padding:10px 20px; margin-bottom:22px;
  font-size:1rem; color:#ffd700; font-weight:600;
}
.modal-btns { display:flex; gap:10px; justify-content:center; }
.btn-replay, .btn-home-m {
  padding:12px 28px; border-radius:28px; border:none;
  cursor:pointer; font-size:.95rem; font-weight:600;
  font-family:'Poppins',sans-serif; transition:all .3s;
}
.btn-replay { background:#10B981; color:#fff; }
.btn-replay:hover { background:#059669; transform:scale(1.04); }
.btn-home-m { background:rgba(255,255,255,.1); color:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.15); }
.btn-home-m:hover { background:rgba(255,255,255,.18); }

.confetti { position:fixed; top:-10px; border-radius:2px; animation:fall linear forwards; }
@keyframes fall { 0%{transform:translateY(0) rotate(0);opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }
</style>
</head>
<body>

<a class="btn-back" href="../borne/index.html">← Accueil</a>

<header>
  <h1>🧠 Memory Magasin</h1>
  <p>Trouvez toutes les paires avant la fin du temps !</p>
</header>

<div class="diff-btns">
  <button class="diff-btn active" onclick="setDiff('facile')">😊 Facile</button>
  <button class="diff-btn"        onclick="setDiff('normal')">😤 Normal</button>
  <button class="diff-btn"        onclick="setDiff('difficile')">🔥 Difficile</button>
</div>

<div class="hud">
  <div class="hud-item"><div class="hud-value" id="moves-val">0</div><div class="hud-label">Coups</div></div>
  <div class="hud-item"><div class="hud-value" id="pairs-val">0/8</div><div class="hud-label">Paires</div></div>
  <div class="hud-item"><div class="hud-value" id="timer-val">90</div><div class="hud-label">Secondes</div></div>
  <div class="hud-item"><div class="hud-value" id="score-val">0</div><div class="hud-label">Score</div></div>
</div>

<div id="grid"></div>

<div id="win-modal">
  <div class="modal-box" id="modal-box">
    <span class="modal-icon" id="modal-icon">🏆</span>
    <div class="modal-title" id="modal-title">Bravo !</div>
    <div class="modal-text"  id="modal-text">Toutes les paires !</div>
    <div class="score-badge" id="modal-score">Score : 0</div>
    <div class="modal-btns">
      <button class="btn-replay" onclick="window.location.href='../borne/index.html?action=secondchance'">🎲 2ème Chance</button>
      <button class="btn-home-m" onclick="window.location.href='../borne/index.html'">🏠 Accueil</button>
    </div>
  </div>
</div>

<script>
const CODE_BARRE      = new URLSearchParams(window.location.search).get('code') || null;
const CLIENT_ID       = new URLSearchParams(window.location.search).get('client_id') || null;
const PARTIE_ID       = new URLSearchParams(window.location.search).get('partie_id') || null;
const DEUXIEME_CHANCE = new URLSearchParams(window.location.search).get('deuxieme_chance') === '1'
  || sessionStorage.getItem('bp_deuxieme_chance') === '1';
sessionStorage.removeItem('bp_deuxieme_chance');
const FROM_APP        = new URLSearchParams(window.location.search).get('from') === 'app';
const API = '../api';
const THEMES = {
  facile:    { time:90,  pairs:6,  size:100, cols:4, emoji:['🍎','🛒','🏷️','💰','🎁','🛍️'] },
  normal:    { time:70,  pairs:8,  size:90,  cols:4, emoji:['🍎','🛒','🏷️','💰','🎁','🛍️','⭐','🎯'] },
  difficile: { time:50,  pairs:10, size:80,  cols:5, emoji:['🍎','🛒','🏷️','💰','🎁','🛍️','⭐','🎯','🎪','🏆'] },
};
let diff = 'facile', cfg = THEMES.facile;
let cards=[], flipped=[], matched=0, moves=0, timer=0, timerInterval, score=0, blocked=false;

// Lots chargés depuis la BDD
let DOTATIONS_GAINS = [
  { libelle:'Gourde',         probabilite:25 },
  { libelle:'Stylo Baggio',   probabilite:20 },
  { libelle:'Clé USB 16 Go',  probabilite:20 },
  { libelle:'Collier Baggio', probabilite:15 },
];

async function loadDotations() {
  try {
    const r = await fetch(`${API}/jeux_public.php`);
    const data = await r.json();
    if (data.success) {
      const mem = data.jeux.find(j => j.type_jeu === 'memory');
      if (mem && mem.dotations.length > 0) {
        const gains = mem.dotations.filter(d =>
          !d.libelle.toLowerCase().includes('perdu') &&
          !d.libelle.toLowerCase().includes('retentez')
        );
        if (gains.length > 0) DOTATIONS_GAINS = gains;
      }
    }
  } catch(_) {}
}

function pickLot() {
  const total = DOTATIONS_GAINS.reduce((s, d) => s + d.probabilite, 0);
  let r = Math.random() * total, acc = 0;
  for (const d of DOTATIONS_GAINS) {
    acc += d.probabilite;
    if (r <= acc) return d.libelle;
  }
  return DOTATIONS_GAINS[0].libelle;
}

// Audio
const AudioCtx = window.AudioContext||window.webkitAudioContext;
let ac;
function getAC(){ return ac||(ac=new AudioCtx()); }
function beep(freq,dur,type='sine',vol=.12){
  try{ const o=getAC().createOscillator(),g=getAC().createGain();
  o.connect(g);g.connect(getAC().destination);
  o.frequency.value=freq;o.type=type;
  g.gain.setValueAtTime(vol,getAC().currentTime);
  g.gain.exponentialRampToValueAtTime(.001,getAC().currentTime+dur);
  o.start();o.stop(getAC().currentTime+dur); }catch(_){}
}
function playFlip()  { beep(400,.08,'sine',.08); }
function playMatch() { beep(523,.1);setTimeout(()=>beep(659,.1),110);setTimeout(()=>beep(784,.2),220); }
function playMiss()  { beep(200,.15,'sawtooth',.08); }
function playWin()   { [523,659,784,1047,1318].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*110)); }
function playLose()  { beep(300,.6,'sawtooth'); }

function setDiff(d){
  diff=d; cfg=THEMES[d];
  document.querySelectorAll('.diff-btn').forEach((b,i)=>{
    b.classList.toggle('active',['facile','normal','difficile'][i]===d);
  });
  initGame();
}

function initGame(){
  document.getElementById('win-modal').classList.remove('show');
  clearInterval(timerInterval);
  flipped=[]; matched=0; moves=0; timer=cfg.time; score=0; blocked=false;
  cfg=THEMES[diff]; updateHUD();

  // Grid
  const grid=document.getElementById('grid');
  grid.style.gridTemplateColumns=`repeat(${cfg.cols},${cfg.size}px)`;
  grid.innerHTML='';

  const pairs=[...cfg.emoji,...cfg.emoji];
  shuffle(pairs);
  cards=pairs;

  pairs.forEach((emoji,i)=>{
    const card=document.createElement('div');
    card.className='card';
    card.style.width=card.style.height=cfg.size+'px';
    card.dataset.emoji=emoji;
    card.innerHTML=`<div class="card-inner">
      <div class="card-back"></div>
      <div class="card-front" style="font-size:${cfg.size*.4}px">${emoji}</div>
    </div>`;
    card.addEventListener('click',()=>flipCard(card));
    grid.appendChild(card);
  });

  timerInterval=setInterval(()=>{
    timer--;
    const tv=document.getElementById('timer-val');
    tv.textContent=timer;
    tv.classList.toggle('urgent',timer<=10);
    if(timer<=0){ clearInterval(timerInterval); gameOver(false); }
  },1000);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function flipCard(card){
  if(blocked||card.classList.contains('flipped')||card.classList.contains('matched')||flipped.length===2) return;
  card.classList.add('flipped');
  flipped.push(card);
  playFlip();
  if(flipped.length===2){ moves++; updateHUD(); checkMatch(); }
}

function checkMatch(){
  const [a,b]=flipped;
  if(a.dataset.emoji===b.dataset.emoji){
    a.classList.add('matched'); b.classList.add('matched');
    matched++;
    const bonus=Math.max(10,timer*2);
    score+=bonus;
    document.getElementById('pairs-val').textContent=`${matched}/${cfg.pairs}`;
    updateHUD(); flipped=[];
    playMatch();
    if(matched===cfg.pairs){ clearInterval(timerInterval); setTimeout(()=>gameOver(true),400); }
  } else {
    blocked=true;
    a.classList.add('shaking'); b.classList.add('shaking');
    playMiss();
    score=Math.max(0,score-5);
    updateHUD();
    setTimeout(()=>{
      a.classList.remove('flipped','shaking');
      b.classList.remove('flipped','shaking');
      flipped=[]; blocked=false;
    },800);
  }
}

function updateHUD(){
  document.getElementById('moves-val').textContent=moves;
  document.getElementById('score-val').textContent=score;
}

function gameOver(win){
  const lot = win ? pickLot() : null;
  const modal=document.getElementById('modal-box');
  modal.className=`modal-box ${win?'win':'lose'}`;
  document.getElementById('modal-icon').textContent=win?'🏆':'⏱️';
  document.getElementById('modal-title').textContent=win?'FÉLICITATIONS !':'Temps écoulé !';
  document.getElementById('modal-text').textContent=win
    ?`${cfg.pairs} paires trouvées en ${moves} coups !`
    :'Retentez votre chance !';
  document.getElementById('modal-score').textContent=win
    ?`Score : ${score} pts — Lot gagné : ${lot} !`
    :'Dommage, essayez encore !';
  document.getElementById('win-modal').classList.add('show');
  if (win || DEUXIEME_CHANCE || FROM_APP) { document.querySelector('.btn-replay')?.remove(); }
  if(win){ playWin(); launchConfetti(); } else { playLose(); }

  const _regBody = {jeu:'memory',gain:lot,score,gagne:win,code_barre:CODE_BARRE,client_id:CLIENT_ID,deuxieme_chance:DEUXIEME_CHANCE};
  if (DEUXIEME_CHANCE && PARTIE_ID) _regBody.partie_id = PARTIE_ID;
  fetch(`${API}/enregistrer_partie.php`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(_regBody)
  }).then(r=>r.json()).then(d=>{
    if (!DEUXIEME_CHANCE && !FROM_APP && d.partie_id) sessionStorage.setItem('bp_partie_id', d.partie_id);
  }).catch(()=>{});
}

// Navigation adaptée selon le contexte (borne ou app)
(function initNav() {
  const backBtn = document.querySelector('.btn-back');
  if (backBtn) backBtn.href = FROM_APP ? '../application_mobile/' : '../borne/index.html';

  const replayBtn = document.querySelector('.btn-replay');
  if (replayBtn) {
    if (FROM_APP || DEUXIEME_CHANCE) { replayBtn.remove(); }
    else { replayBtn.onclick = () => { window.location.href = '../borne/index.html?action=secondchance'; }; }
  }

  const homeBtn = document.querySelector('.btn-home-m');
  if (homeBtn) homeBtn.onclick = () => { window.location.href = FROM_APP ? '../application_mobile/' : '../borne/index.html'; };
})();

function launchConfetti(){
  const colors=['#10B981','#ffd700','#4ecdc4','#7c3aed','#f59e0b'];
  for(let i=0;i<100;i++){
    const c=document.createElement('div'); c.className='confetti';
    const s=5+Math.random()*8;
    c.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.8}s;
      border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(c);
    c.addEventListener('animationend',()=>c.remove());
  }
}

loadDotations();
initGame();
</script>
</body>
</html>
